name: development-quality
on: [workflow_dispatch, push, pull_request]
permissions:
  contents: read
jobs:
  documentation-and-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: xUnit and ArchUnitNET
        shell: pwsh
        run: ./scripts/Test-Development.ps1
      - name: OpenAPI, LikeC4 and DocFX
        shell: pwsh
        run: ./scripts/Build-Documentation.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: development-test-results
          path: artifacts/tests/*.trx
      - uses: actions/upload-artifact@v4
        with:
          name: yuzuha-development-documentation
          path: artifacts/docfx/site
