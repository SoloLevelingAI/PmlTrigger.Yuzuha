name: build

on:
  push:
  pull_request:

jobs:
  net10:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore src/YuzuhaToolkit.Mcp/YuzuhaToolkit.Mcp.csproj
      - name: Build
        run: dotnet build src/YuzuhaToolkit.Mcp/YuzuhaToolkit.Mcp.csproj -c Release --no-restore
