name: development-quality
on: [workflow_dispatch, push, pull_request]
permissions:
  contents: read
jobs:
  contract-workbench:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generated contract metadata and shared tokens
        run: npm run contracts:check
      - name: Six ION palettes
        run: npm run contracts:styles:themes
      - name: Contract, evidence, publication and method bridge tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/contract-ci | Out-Null
          npm run contracts:test 2>&1 | Tee-Object artifacts/contract-ci/unit.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install locked Playwright Chromium
        run: npm run contracts:browsers:install
      - name: Contract UI and isolated method browser checks
        run: npm run contracts:ci:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-workbench-${{ github.sha }}-${{ runner.os }}
          path: |
            artifacts/contract-ci/**
            artifacts/contract-style-compact/**
            artifacts/contract-style-lab/review/**
            artifacts/contract-style-methods/**
  documentation-and-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: xUnit and ArchUnitNET
        shell: pwsh
        run: ./scripts/Test-Development.ps1
      - name: OpenAPI, LikeC4 and DocFX
        shell: pwsh
        run: ./scripts/Build-Documentation.ps1
      - name: WPF isolated flows and viewport checks
        shell: pwsh
        run: ./scripts/run-documented-test.ps1 -TestId 'smoke:desktop-flows'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: development-tests-${{ github.sha }}-${{ runner.os }}
          path: |
            artifacts/tests/*.trx
            artifacts/tests/run-metadata.json
            artifacts/handoff-validation/**/*.json
            artifacts/handoff-validation/**/*.tap
            artifacts/tests/launch-scenarios/**/*.json
            artifacts/tests/launch-scenarios/**/*.toml
            artifacts/tests/launch-scenarios/**/*.html
            artifacts/tests/launch-scenarios/**/*.log
            artifacts/dt/**/desktop-smoke.json
            artifacts/dt/**/run-metadata.json
            artifacts/dt/**/documented-run.json
            artifacts/dt/**/smoke-result.json
            artifacts/dt/**/console.log
            artifacts/dt/**/smoke-error.txt
            artifacts/dt/**/desktop/**/*.png
            artifacts/dt/**/binding-errors.log
      - uses: actions/upload-artifact@v4
        with:
          name: yuzuha-documentation-${{ github.sha }}-${{ runner.os }}
          path: artifacts/docfx/site
