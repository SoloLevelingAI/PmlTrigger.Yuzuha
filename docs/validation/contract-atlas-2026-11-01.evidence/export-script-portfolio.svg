<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1728" viewBox="0 0 1200 1728" role="img" aria-labelledby="atlas-title atlas-description"><title id="atlas-title">UI发送前持久门禁 · PMLTWIN Contract Atlas</title><desc id="atlas-description">当前视图的静态契约说明，保留状态与证据边界，不是运行轨迹。</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#c5ec9b"/></marker></defs><rect width="100%" height="100%" fill="#10191c"/><text x="54" y="55" font-size="13" fill="#c5ec9b" font-family="Segoe UI,Microsoft YaHei,sans-serif">PMLTWIN / CONTRACT ATLAS</text><text x="54" y="86.1" font-size="35" fill="#eff3e9" font-family="Segoe UI,Microsoft YaHei,sans-serif">UI发送前持久门禁</text><text x="54" y="148.6" font-size="13" fill="#a8b9b6" font-family="Segoe UI,Microsoft YaHei,sans-serif">快照 2026-11-01 · portfolio · script · script:ui-pending-gate</text><text x="54" y="170.7" font-size="13" fill="#a8b9b6" font-family="Segoe UI,Microsoft YaHei,sans-serif">筛选：Ribbon / all · 关系是静态契约，非运行轨迹</text><text x="54" y="192.79999999999998" font-size="12" fill="#a8b9b6" font-family="Segoe UI,Microsoft YaHei,sans-serif">关联规范原状态：无直接映射；不得从实现状态推断规范已验证</text><text x="54" y="233.2" font-size="22" fill="#eff3e9" font-family="Segoe UI,Microsoft YaHei,sans-serif">编辑、部署与独立加载核验</text><text x="54" y="270.59999999999997" font-size="14" fill="#a8b9b6" font-family="Segoe UI,Microsoft YaHei,sans-serif">磁盘写入不等于运行时已加载。</text><rect x="54" y="302.4" width="250" height="118" rx="12" fill="#192428" stroke="#354747"/><text x="70" y="329.4" font-size="12" fill="#c5ec9b" font-family="Segoe UI,Microsoft YaHei,sans-serif">01</text><text x="70" y="355.4" font-size="15" fill="#eff3e9" font-family="Segoe UI,Microsoft YaHei,sans-serif">冻结差异</text><text x="70" y="393.4" font-size="11" fill="#a8b9b6" font-family="Segoe UI,Microsoft YaHei,sans-serif">绑定文档、目标与期限。</text><rect x="334" y="302.4" width="250" height="118" rx="12" fill="#192428" stroke="#354747"/><text x="350" y="329.4" font-size="12" fill="#c5ec9b" font-family="Segoe UI,Microsoft YaHei,sans-serif">02</text><text x="350" y="355.4" font-size="15" fill="#eff3e9" font-family="Segoe UI,Microsoft YaHei,sans-serif">先记录pending</text><text x="350" y="393.4" font-size="11" fill="#a8b9b6" font-family="Segoe UI,Microsoft YaHei,sans-serif">写前持久，跨页面互斥。</text><rect x="614" y="302.4" width="250" height="118" rx="12" fill="#192428" stroke="#354747"/><text x="630" y="329.4" font-size="12" fill="#c5ec9b" font-family="Segoe UI,Microsoft YaHei,sans-serif">03</text><text x="630" y="355.4" font-size="15" fill="#eff3e9" font-family="Segoe UI,Microsoft YaHei,sans-serif">仅发送原引用</text><text x="630" y="393.4" font-size="11" fill="#a8b9b6" font-family="Segoe UI,Microsoft YaHei,sans-serif">写后哈希核验。</text><rect x="894" y="302.4" width="250" height="118" rx="12" fill="#192428" stroke="#354747"/><text x="910" y="329.4" font-size="12" fill="#c5ec9b" font-family="Segoe UI,Microsoft YaHei,sans-serif">04</text><text x="910" y="355.4" font-size="15" fill="#eff3e9" font-family="Segoe UI,Microsoft YaHei,sans-serif">人工核对</text><text x="910" y="393.4" font-size="11" fill="#a8b9b6" font-family="Segoe UI,Microsoft YaHei,sans-serif">不确定时暂停，不自动重放。</text><rect x="54" y="452.4" width="250" height="118" rx="12" fill="#192428" stroke="#354747"/><text x="70" y="479.4" font-size="12" fill="#c5ec9b" font-family="Segoe UI,Microsoft YaHei,sans-serif">05</text><text x="70" y="505.4" font-size="15" fill="#eff3e9" font-family="Segoe UI,Microsoft YaHei,sans-serif">独立核验加载</text><text x="70" y="543.4" font-size="11" fill="#a8b9b6" font-family="Segoe UI,Microsoft YaHei,sans-serif">产品范围、实际UI与未执行宏分别记录</text><text x="70" y="560.4" font-size="11" fill="#a8b9b6" font-family="Segoe UI,Microsoft YaHei,sans-serif">。</text><path d="M304,361.4 L328,361.4" fill="none" stroke="#c5ec9b" marker-end="url(#arrow)"/><path d="M584,361.4 L608,361.4" fill="none" stroke="#c5ec9b" marker-end="url(#arrow)"/><text x="54" y="602.4" font-size="13" fill="#efc17f" font-family="Segoe UI,Microsoft YaHei,sans-serif">不确定支路：仅发送原引用 → 人工核对 / unknown</text><text x="54" y="624.5" font-size="13" fill="#efc17f" font-family="Segoe UI,Microsoft YaHei,sans-serif">恢复支路：人工核对 → 冻结差异 / 人工核对后新预览</text><text x="54" y="658.6" font-size="19" fill="#eff3e9" font-family="Segoe UI,Microsoft YaHei,sans-serif">契约与实现边界</text><text x="54" y="695.9" font-size="12" fill="#c5ec9b" font-family="Segoe UI,Microsoft YaHei,sans-serif">输入</text><text x="54" y="716.3" font-size="14" fill="#a8b9b6" font-family="Segoe UI,Microsoft YaHei,sans-serif">已确认的v2计划引用，或明确标记的v1首次生成输入；记录非秘密planId/digest/kind/端点，不记录项目口令。</text><text x="54" y="750.0999999999999" font-size="12" fill="#c5ec9b" font-family="Segoe UI,Microsoft YaHei,sans-serif">前置</text><text x="54" y="770.4999999999999" font-size="14" fill="#a8b9b6" font-family="Segoe UI,Microsoft YaHei,sans-serif">没有未决部署记录；状态存储可写可回读；新建v1不冒充服务端冻结计划。</text><text x="54" y="804.2999999999998" font-size="12" fill="#c5ec9b" font-family="Segoe UI,Microsoft YaHei,sans-serif">算法/手段</text><text x="54" y="824.6999999999998" font-size="14" fill="#a8b9b6" font-family="Segoe UI,Microsoft YaHei,sans-serif">消费本地计划 → 发送前持久pending → 发一次apply → 核对回执身份/状态/activation → 可确认结束时清</text><text x="54" y="848.4999999999998" font-size="14" fill="#a8b9b6" font-family="Segoe UI,Microsoft YaHei,sans-serif">记录。Web使用同源navigator.locks覆盖整个写请求，锁内再次核对localStorage，无可靠锁支持则拒绝发送；W</text><text x="54" y="872.2999999999997" font-size="14" fill="#a8b9b6" font-family="Segoe UI,Microsoft YaHei,sans-serif">PF使用跨进程FileShare.None租约覆盖整个写请求，并在发送前CreateNew写pending、Flush(true)</text><text x="54" y="896.0999999999997" font-size="14" fill="#a8b9b6" font-family="Segoe UI,Microsoft YaHei,sans-serif">。</text><text x="54" y="929.8999999999996" font-size="12" fill="#c5ec9b" font-family="Segoe UI,Microsoft YaHei,sans-serif">副作用</text><text x="54" y="950.2999999999996" font-size="14" fill="#a8b9b6" font-family="Segoe UI,Microsoft YaHei,sans-serif">写本机非秘密门禁记录；复用既有API，不建立第二个部署引擎。读到pending的新页面/进程先暂停写入，不因为页面关闭或服务重启自</text><text x="54" y="974.0999999999996" font-size="14" fill="#a8b9b6" font-family="Segoe UI,Microsoft YaHei,sans-serif">动解除。</text><text x="54" y="1007.8999999999995" font-size="12" fill="#c5ec9b" font-family="Segoe UI,Microsoft YaHei,sans-serif">校验</text><text x="54" y="1028.2999999999995" font-size="14" fill="#a8b9b6" font-family="Segoe UI,Microsoft YaHei,sans-serif">存储失败不得发送；v2回执必须匹配计划编号/摘要、版本、有效状态和activation类型。断连/超时/错身份/损坏回执保留unk</text><text x="54" y="1052.0999999999995" font-size="14" fill="#a8b9b6" font-family="Segoe UI,Microsoft YaHei,sans-serif">nown，阻止批次继续或自动重新预览。v1兼容入口发送后任何错误均保守unknown，不把旧引擎可能已保存历史的4xx当成无副作用</text><text x="54" y="1075.8999999999994" font-size="14" fill="#a8b9b6" font-family="Segoe UI,Microsoft YaHei,sans-serif">拒绝；v2明确写前拒绝可以清理本地pending。跨页面竞争保护来自navigator锁而非localStorage自身原子性；人</text><text x="54" y="1099.6999999999994" font-size="14" fill="#a8b9b6" font-family="Segoe UI,Microsoft YaHei,sans-serif">工解除必须核对原计划，不能视为服务器撤销。</text><text x="54" y="1133.4999999999993" font-size="12" fill="#c5ec9b" font-family="Segoe UI,Microsoft YaHei,sans-serif">回执</text><text x="54" y="1153.8999999999994" font-size="14" fill="#a8b9b6" font-family="Segoe UI,Microsoft YaHei,sans-serif">UI显示原编号、磁盘状态、未核验加载与人工核对出口；pending本身只说明可能未决，不证明服务器已受理或未执行。</text><text x="54" y="1187.6999999999994" font-size="12" fill="#c5ec9b" font-family="Segoe UI,Microsoft YaHei,sans-serif">恢复</text><text x="54" y="1208.0999999999995" font-size="14" fill="#a8b9b6" font-family="Segoe UI,Microsoft YaHei,sans-serif">重开读取记录后核对工作区历史、文件和备份；仅显式人工核对并二次确认才解除暂停。解除也获取同一Web锁/WPF跨进程租约，并比较提示</text><text x="54" y="1231.8999999999994" font-size="14" fill="#a8b9b6" font-family="Segoe UI,Microsoft YaHei,sans-serif">时原编号与当前持久编号，旧A不能清除新B；当前持久记录优先于旧进程/标签内存编号。旧计划不重放、后续须新预览。上述客户端专项与离线</text><text x="54" y="1255.6999999999994" font-size="14" fill="#a8b9b6" font-family="Segoe UI,Microsoft YaHei,sans-serif">全量已通过，原生预览、HTTP客户端与Web DOM证据仍各按其范围陈述。</text><text x="54" y="1309.4999999999993" font-size="15" fill="#c5ec9b" font-family="Segoe UI,Microsoft YaHei,sans-serif">证据范围 / EVIDENCE BOUNDARIES</text><text x="54" y="1334.9999999999993" font-size="12" fill="#a8b9b6" font-family="Segoe UI,Microsoft YaHei,sans-serif">ui · passed · 2026-10-31</text><text x="54" y="1355.3999999999994" font-size="12" fill="#a8b9b6" font-family="Segoe UI,Microsoft YaHei,sans-serif">产品：synthetic</text><text x="54" y="1375.7999999999995" font-size="13" fill="#a8b9b6" font-family="Segoe UI,Microsoft YaHei,sans-serif">离线53项通过，Web DOM完整apply；原生WPF仅预览，Apply由HTTP客户端验证。</text><text x="54" y="1397.8999999999994" font-size="12" fill="#efc17f" font-family="Segoe UI,Microsoft YaHei,sans-serif">未涵盖：不是UI全程实机验收；首次新建仍为v1兼容</text><text x="54" y="1426.2999999999995" font-size="12" fill="#a8b9b6" font-family="Segoe UI,Microsoft YaHei,sans-serif">runtime · passed · 2026-10-31</text><text x="54" y="1446.6999999999996" font-size="12" fill="#a8b9b6" font-family="Segoe UI,Microsoft YaHei,sans-serif">产品：E3D · 版本：2.1 · 模块：DESIGN</text><text x="54" y="1467.0999999999997" font-size="13" fill="#a8b9b6" font-family="Segoe UI,Microsoft YaHei,sans-serif">限定产品正常重启后实际页签、分组、32/16图标与Tooltip通过。</text><text x="54" y="1489.1999999999996" font-size="12" fill="#efc17f" font-family="Segoe UI,Microsoft YaHei,sans-serif">未涵盖：未点击宏；直接HTTP部署，不是UI全程；不外推其他产品与模块</text><text x="54" y="1529.5999999999997" font-size="14" fill="#c5ec9b" font-family="Segoe UI,Microsoft YaHei,sans-serif">来源与指纹 / SOURCE PROVENANCE</text><text x="54" y="1553.3999999999996" font-size="11" fill="#a8b9b6" font-family="Segoe UI,Microsoft YaHei,sans-serif">source:overview · 总体、Feature与内部Script审阅说明 · reviewed-summary</text><text x="54" y="1572.0999999999997" font-size="10" fill="#a8b9b6" font-family="Segoe UI,Microsoft YaHei,sans-serif">SHA256 1c253f9f4ec4baeadc4e598107de726fa34490905a32d84840e4737571532000</text><text x="54" y="1589.0999999999997" font-size="11" fill="#a8b9b6" font-family="Segoe UI,Microsoft YaHei,sans-serif">source:evidence-ribbon-ui · Ribbon界面分层验证 · evidence</text><text x="54" y="1607.7999999999997" font-size="10" fill="#a8b9b6" font-family="Segoe UI,Microsoft YaHei,sans-serif">SHA256 526b7e7542a1502f9aac70f642e89911503b4faa478bfe8958f150db04ed5567</text><text x="54" y="1624.7999999999997" font-size="11" fill="#a8b9b6" font-family="Segoe UI,Microsoft YaHei,sans-serif">source:evidence-ribbon-runtime · 限定产品运行时外观验证 · evidence</text><text x="54" y="1643.4999999999998" font-size="10" fill="#a8b9b6" font-family="Segoe UI,Microsoft YaHei,sans-serif">SHA256 9778c9cfde3970cbfb91588678bfc5becc08f4007fb7305c1ca7181d7c680044</text><text x="54" y="1672.4999999999998" font-size="12" fill="#a8b9b6" font-family="Segoe UI,Microsoft YaHei,sans-serif">公开元数据的静态说明 · 不执行工程操作 · 不是运行截图或新的验收结论。</text></svg>