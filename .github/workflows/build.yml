name: build
on: [workflow_dispatch, push, pull_request]
jobs:
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Publish both Native AOT servers
        shell: pwsh
        run: ./scripts/Build-NativeServers.ps1
      - name: Verify built-in priority without SQLite
        run: python -X utf8 tests/v03/builtin_smoke.py runtime/net10
