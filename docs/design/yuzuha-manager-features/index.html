<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yuzuha · Feature 设计索引</title><style>:root{font-family:system-ui,"Microsoft YaHei UI",sans-serif;color:#17233b;background:#f5f7fc}body{margin:0}header{padding:24px 32px;background:white;border-bottom:1px solid #dce3ef}h1{font-size:24px;margin:0 0 10px}p{line-height:1.7;color:#5d6b82}main{display:grid;grid-template-columns:210px minmax(0,1fr);gap:24px;padding:24px}nav{display:grid;align-content:start;gap:8px}button,a{font:inherit}button{background:white;border:1px solid #dce3ef;border-radius:8px;padding:12px;text-align:left;color:inherit;cursor:pointer}button[aria-pressed=true]{border-color:#3559d8;color:#3559d8;background:#eef2ff}:focus-visible{outline:3px solid #3559d8;outline-offset:3px}section{min-width:0}aside{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}aside a{padding:12px;color:#3559d8}img{width:100%;max-width:1440px;display:block;border:1px solid #dce3ef;border-radius:8px;background:white}.note{padding:14px;background:#fff1db;border-radius:8px;color:#754600}@media(max-width:850px){main{grid-template-columns:1fr}nav{grid-template-columns:repeat(2,minmax(0,1fr))}}</style><header><h1>Yuzuha / 独立 Feature 设计</h1><p><a href="../compact-workspace/index.html">当前精简版：Dashboard · 五个工作区 →</a></p><p>一个 Feature，一个原生文件和一份交接。当前是设计草稿与合成状态，生产功能另行验收。</p><a href="README.md">交接说明</a> · <a href="00-design-system.figcraft">共用基础</a> · <a href="tokens.json">Tokens 1.0.0</a></header><main><nav aria-label="Feature"><button type="button" data-feature="01-overview-connections">总览与连接</button><button type="button" data-feature="02-deployment">环境部署</button><button type="button" data-feature="03-launch-profiles">启动工程</button><button type="button" data-feature="04-tool-copy">工具与目录复制</button><button type="button" data-feature="05-knowledge">知识导入与检查</button><button type="button" data-feature="06-functions">函数与调用权限</button><button type="button" data-feature="07-user-data">用户数据目录</button><button type="button" data-feature="08-plugins">可选插件</button><button type="button" data-feature="09-records">记录与问题定位</button></nav><section><h2 id="title"></h2><aside id="modes"><button data-view="light">浅色</button><button data-view="dark">深色</button><button data-view="narrow">960 窄窗</button><button data-view="states">状态审阅</button><button data-view="registration" id="registration">登记表单</button><a id="native">原生 .figcraft</a><a id="handoff">只读本 Feature 交接</a></aside><p class="note">原型只连接画板；表单编辑、真实操作、键盘行为与 WPF 接线仍待实现和验证。</p><img id="preview" alt=""><p id="file"></p></section></main><script>const features=[{"id":"01-overview-connections","title":"总览与连接","registration":false},{"id":"02-deployment","title":"环境部署","registration":false},{"id":"03-launch-profiles","title":"启动工程","registration":false},{"id":"04-tool-copy","title":"工具与目录复制","registration":false},{"id":"05-knowledge","title":"知识导入与检查","registration":false},{"id":"06-functions","title":"函数与调用权限","registration":true},{"id":"07-user-data","title":"用户数据目录","registration":false},{"id":"08-plugins","title":"可选插件","registration":false},{"id":"09-records","title":"记录与问题定位","registration":false}];let selected=features.find(f=>f.id==='06-functions'),view='light';function render(){document.getElementById('title').textContent=selected.title;document.getElementById('preview').src='previews/'+selected.id+'-'+view+'.png';document.getElementById('preview').alt=selected.title+' / '+view+' / 设计草稿';document.getElementById('native').href=selected.id+'.figcraft';document.getElementById('handoff').href=selected.id+'.handoff.md';document.getElementById('file').textContent='上下文：'+selected.id+'.handoff.md + source/features/'+selected.id+'.json + tokens.json';document.getElementById('registration').hidden=!selected.registration;document.querySelectorAll('[data-feature]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.feature===selected.id));document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===view));}document.querySelectorAll('[data-feature]').forEach(b=>b.onclick=()=>{selected=features.find(f=>f.id===b.dataset.feature);if(view==='registration'&&!selected.registration)view='light';render();});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render();});render();</script></html>
