name: Phayton command regression
on: [workflow_dispatch, push, pull_request]
jobs:
  commands:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run operation and bridge regressions without AVEVA
        run: dotnet run --project tests/Phayton -c Release
      - name: Build CLI
        run: dotnet build src/PmlTwin.Phayton.Cli -c Release
      - name: Build disabled legacy filename for migration verification
        run: dotnet build src/YuzuhaToolkit.Mcp -c Release
      - name: Check native CLI and rejected legacy MCP process
        run: python -X utf8 tests/Phayton/frontends.py --cli src/PmlTwin.Phayton.Cli/bin/Release/net10.0/PmlTwin.Phayton.Cli.exe --mcp src/YuzuhaToolkit.Mcp/bin/Release/net10.0/win-x64/YuzuhaToolkit.Mcp.exe
      - name: Publish Native AOT CLI
        shell: pwsh
        run: |
          ./scripts/Build-NativeCli.ps1 -OutputRoot artifacts/phayton/cli
      - name: Check Native AOT CLI
        run: python -X utf8 tests/Phayton/frontends.py --cli artifacts/phayton/cli/PmlTwin.Phayton.Cli.exe --report artifacts/phayton/native-processes.json
