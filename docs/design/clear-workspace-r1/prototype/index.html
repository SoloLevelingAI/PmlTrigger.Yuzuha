<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yuzuha · Clear Workspace</title><link rel="stylesheet" href="style.css"></head><body>
<div class="preview-bar"><span><b>YUZUHA</b> &nbsp; CLEAR WORKSPACE / R1</span><div><button data-mode="desktop" class="selected">桌面工作台</button><button data-mode="docs">DocFX 文档</button><button id="design-notes">设计说明</button></div><span class="demo-dot">交互原型 · 演示数据</span></div>
<div class="window" id="window"><header class="titlebar"><button class="brand" data-go="launch"><span class="logo">Y</span> Yuzuha</button><span class="caption">本地工作空间</span><button class="global-search" id="search-open">搜索页面或文档 <kbd>Ctrl K</kbd></button><div class="window-controls"><button aria-label="收起预览" id="minimize">—</button><button aria-label="切换预览大小" id="maximize">□</button><button aria-label="关闭预览面板" id="close-window">×</button></div></header>
<div class="body-layout"><aside class="sidebar"><div class="eyebrow">WORKSPACE</div><nav id="nav"><button data-go="launch"><i>◈</i>工作台</button><button data-go="apps"><i>▦</i>应用</button><button data-go="knowledge"><i>▤</i>知识库</button><button data-go="records"><i>◷</i>运行记录<span id="record-count"></span></button></nav><p class="sidebar-note">你的工具，<br>有序放在一起。</p><div class="side-bottom"><div class="connection">○ &nbsp; 当前未连接</div><button data-go="settings"><i>⚙</i>设置</button><button data-mode="docs"><i>↗</i>文档与学习</button></div></aside><main id="main" tabindex="-1"></main></div></div>
<div id="docs" hidden></div><button id="restore-window" hidden>重新打开工作台预览 ↗</button><div id="toast" role="status" aria-live="polite"></div>
<dialog id="dialog"><div class="dialog-heading"><h2 id="dialog-title"></h2><button id="dialog-close" aria-label="关闭对话框">×</button></div><div id="dialog-body"></div><div id="dialog-actions"></div></dialog><script src="app.js"></script></body></html>
