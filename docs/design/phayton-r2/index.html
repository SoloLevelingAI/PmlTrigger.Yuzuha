function contextButton(label,action,id,active,count,ico=''){return `<button data-${action}="${id}" class="${active?'active':''}">${ico?icon(ico):''}${label}${count!==undefined?`<span class="count">${count}</span>`:''}</button>`}
function context(){let title='',body='',end='';if(state.page==='launch'){title='我的工程';body=`<input id="project-search" aria-label="查找工程" placeholder="查找工程…" value="${esc(state.projectSearch)}"><div class="context-label">最近使用</div><div class="recent-list">${state.projects.map((p,i)=>`<button class="recent ${p.name===state.project.name?'active':''}" data-project="${i}" data-match="${esc(p.name.toLowerCase())}" ${p.name.toLowerCase().includes(state.projectSearch.toLowerCase())?'':'hidden'}><b>${esc(p.name)}</b><small>${esc(p.product)} · ${p.time}</small></button>`).join('')}</div>`;end='<b>配置随工程保存</b>账户、MDB 与模块，<br>下次打开，继续使用。'}
 else if(state.page==='knowledge'){title='知识空间';body=`<div class="context-nav">${contextButton('个人笔记','library','notes',state.library==='notes',state.notes.filter(n=>!n.archived).length,'note')}${contextButton('官方参考','library','reference',state.library==='reference',Object.keys(docTitles).length,'book')}${contextButton('我的资料源','library','sources',state.library==='sources',state.sources.filter(s=>!s.archived).length,'source')}${contextButton('归档','library','archive',state.library==='archive',state.notes.filter(n=>n.archived).length,'archive')}</div><div class="context-label">快速筛选</div><div class="context-nav">${['PML','界面','运维'].map(t=>contextButton(t,'tag',t,state.noteSearch===t)).join('')}</div>`;end='<b>经验，留下来。</b>把一次验证中的发现，<br>变成下次可用的方法。'}
 else if(state.page==='settings'){title='设置';body=`<div class="context-nav">${[['directory','用户目录','folder'],['appearance','外观与交互','sun'],['startup','启动行为','play'],['credentials','账户与凭据','shield'],['preview','预览与说明','note']].map(([id,t,i])=>contextButton(t,'setting',id,state.setting===id,undefined,i)).join('')}</div>`;end='<b>由你掌握工作空间</b>日常操作保持简单。<br>低频配置，放在这里。'}
 else if(state.page==='apps'){title='应用';body=`<div class="context-nav">${contextButton('ELDATA 读取','app','data',true,undefined,'apps')}${contextButton('原生 Form 说明','article','forms',false,undefined,'note')}</div><div class="context-label">开发</div><div class="context-nav">${contextButton('按钮与参数','action','binding',false)}${contextButton('部署与验证','article','pml',false)}</div>`;end='<b>从一个小工具开始</b>参数与方法明确绑定，<br>结果有位置，错误有记录。'}
 else{title='运行记录';body=`<div class="context-nav">${contextButton('全部记录','route','records',true,state.records.length,'clock')}</div>`;end='<b>每一步都可追溯</b>这里记录本次预览操作。<br>刷新后恢复初始状态。'}
 return `<aside class="context"><div class="context-heading"><h2>${title}</h2>${state.page==='launch'?'<button data-action="new-project" aria-label="新建工程配置">+</button>':''}</div>${body}<div class="context-note">${end}</div></aside>`}
function render(){document.body.classList.toggle('no-motion',state.prefs.motion);document.body.classList.toggle('compact',state.prefs.compact);$$('.review-strip [data-route]').forEach(b=>b.classList.toggle('active',b.dataset.route===state.page));if(state.hidden){$('#app').innerHTML=`<div class="restore-panel"><div><h1>工作空间已收起</h1><p>预览状态仍然保留。</p>${btn('重新打开工作空间','restore','primary')}</div></div>`;return}if(state.page==='docs'){$('#app').innerHTML=docs();return}const content={launch,knowledge,settings,apps,records}[state.page]();$('#app').innerHTML=`<div class="shell ${state.expanded?'expanded':''}">${topbar()}<div class="workspace">${rail()}${context()}<main id="main" tabindex="-1" class="main ${state.page==='knowledge'?'knowledge-main':''}"><div class="page">${content}</div></main></div></div>`}
function heading(k,title,sub,extra=''){return `<header class="page-header"><div><div class="eyebrow">${k}</div><h1>${title}</h1><p class="subtitle">${sub}</p></div>${extra}</header>`}
function launch(){return `<header class="page-header"><div><small>你的工程，你的工作方式。</small><h1 class="launch-name">${esc(state.project.name)}</h1><p class="subtitle">准备好后，选择一个模块开始。</p></div>${btn(esc(state.project.product)+'　切换产品 ↗','product')}</header><div class="section-head"><h2>01　选择工作模块</h2>${btn('全部模块 ›','modules','ghost small')}</div><div class="module-grid">${['DESIGN','PARAGON','DRAW'].map((m,i)=>`<button class="module-card ${state.project.module===m?'active':''}" data-module="${m}"><b>${m}</b><small>${['模型设计','元件与目录','图纸与出图'][i]}</small><span class="arrow">${state.project.module===m?'✓':'↗'}</span></button>`).join('')}</div>${!['DESIGN','PARAGON','DRAW'].includes(state.project.module)?`<p class="hint">已选择其他模块：${badge(esc(state.project.module))}</p>`:''}<div class="section-head"><h2>02　确认登录信息</h2>${btn('高级启动选项 ›','advanced','ghost small')}</div><div class="field-row">${field('项目名称','project-name',state.project.name)}${field('用户名','project-user',state.project.user)}${field('密码（演示）','project-password',state.passwordSaved?'preview-only':'','password','autocomplete="off" placeholder="仅输入演示密码"')}<label>MDB<input id="project-mdb" list="mdb-list" value="${esc(state.project.mdb)}"><datalist id="mdb-list"><option>/ALL</option><option>/DESIGN</option><option>/CATALOGUE</option></datalist></label></div><div class="inline hint"><label class="check"><input type="checkbox" id="remember" ${state.remember?'checked':''}>记住本机密码</label><span>启动策略：${state.prefs.startup==='rehash-all'?'REHASH ALL':'不执行额外命令'} · ${state.prefs.startupLog?'保留日志':'不记录预览日志'}</span></div><div class="launch-summary"><div><b>${esc(state.project.name)}　/　${state.project.module}　/　${esc(state.project.mdb)}</b><p>设置完成。这份配置，下次仍然在这里。</p></div>${btn('启动 '+esc(state.project.module)+'　↗','launch','primary')}</div><div class="feature-banner"><div><h2>让 AI 帮你做出下一个工具。</h2><p>描述需求 → 编写 PML → 加载到 AVEVA → 核对结果</p></div><button class="btn" data-route="docs/guide/pml">探索工具开发　→</button></div>`}
function captureProject(){if(!$('#project-name'))return;Object.assign(state.project,{name:$('#project-name').value.trim(),user:$('#project-user').value.trim(),mdb:$('#project-mdb').value.trim()})}
function visibleNotes(){return state.notes.filter(n=>n.archived===(state.library==='archive')&&`${n.title} ${n.tags} ${n.body}`.toLowerCase().includes(state.noteSearch.toLowerCase()))}
function selectedNote(){return visibleNotes().find(n=>n.id===state.noteId)||visibleNotes()[0]}
function noteReader(n){if(!n)return `<div class="empty">${icon('book')}<h3>${state.noteSearch?'没有找到匹配的笔记':'这里还没有笔记'}</h3><p>${state.noteSearch?'换一个关键词，或清除筛选。':'新建一篇，记录今天的发现。'}</p>${btn(state.noteSearch?'清除筛选':'新建笔记',state.noteSearch?'clear-note-search':'new-note')}</div>`;state.noteId=n.id;if(state.editing)return noteEditor(n);return `<div class="inline between">${badge(n.archived?'已归档':'个人笔记',n.archived?'gray':'')}<div class="inline">${!n.archived?btn('编辑笔记','edit-note','small'):''}${btn(n.archived?'恢复笔记':'归档…',n.archived?'restore-note':'archive-note','ghost small')}</div></div><h2>${esc(n.title)}</h2><div class="note-meta"><span>修订 ${n.rev}</span><span>${n.time}</span><span>${esc(n.tags)}</span></div><div class="note-body">${esc(n.body)}</div>${n.id===1?'<pre><code>var !eell split $!lastfixArr of $!ob</code></pre>':''}<div class="note-bottom">${btn('修订记录　'+n.history.length,'history','ghost small')}<button class="btn ghost small" data-article="${n.id===2?'forms':n.id===3?'directory':'data'}">关联开发指南 ↗</button></div>`}
function noteEditor(n){return `<div class="note-editor"><div class="inline between"><h2>${n.isNew?'新建笔记':'编辑笔记'}</h2>${badge('编辑中','gray')}</div>${field('标题','note-title',n.title)}${field('标签（用逗号分隔）','note-tags',n.tags)}<label>正文<textarea id="note-body" rows="10">${esc(n.body)}</textarea></label><div id="note-error" class="error" role="alert" hidden></div><div class="inline between"><small>仅保存本次预览中的内容</small><div class="inline">${btn('取消','cancel-edit')}${btn('保存笔记','save-note','primary')}</div></div></div>`}
function knowledge(){let title=state.library==='sources'?'让资料，汇聚在一起。':state.library==='reference'?'可靠的参考，清楚的来源。':state.library==='archive'?'暂时收起，随时找回。':'让经验，留下来。';const sub={notes:'记录、查找与修订，都在你的知识空间。',reference:'官方参考保持只读；点击条目可进入对应指南。',sources:'管理资料来源和索引状态，原文件保留。',archive:'归档保留正文与修订记录，可以随时恢复。'}[state.library];let extra=state.library==='sources'?btn('＋ 添加资料源','new-source','primary'):state.library==='reference'?'<button class="btn" data-route="docs">打开文档中心 ↗</button>':btn('＋ 新建笔记','new-note','primary');let body='';if(state.library==='sources')body=sourceList();else if(state.library==='reference')body=`<div class="panel">${Object.entries(docTitles).map(([id,t])=>`<div class="row-card"><div class="tile">${icon('book')}</div><div class="grow"><h3>${t}</h3><p>Phayton 文档 · 只读参考 · 设计预览内容</p></div><button class="btn small" data-article="${id}">阅读指南 →</button></div>`).join('')}</div>`;else{const notes=visibleNotes();body=`<div class="knowledge-grid"><aside class="note-list"><input id="note-search" aria-label="搜索笔记" placeholder="搜索标题、标签或正文…" value="${esc(state.noteSearch)}"><div class="list-caption"><span>${notes.length} 篇笔记</span><span>最近更新</span></div>${notes.map(n=>`<button class="note-item ${n.id===(selectedNote()?.id)?'active':''}" data-note="${n.id}"><b>${esc(n.title||'未命名笔记')}</b><small class="note-tags">${esc(n.tags)}</small><small>修订 ${n.rev} · ${n.time}</small></button>`).join('')}</aside><article class="note-detail">${noteReader(selectedNote())}</article></div>`}return heading('KNOWLEDGE / YOUR LIBRARY',title,sub,extra)+body}
function sourceList(){const list=state.sources.filter(s=>!s.archived);return `<div class="panel"><div class="inline between"><h2>我的资料源</h2>${badge(list.length+' 个来源','gray')}</div>${list.map(s=>`<div class="row-card"><div class="tile">${icon('folder')}</div><div class="grow"><h3>${esc(s.name)} ${badge(s.status,s.count?'green':'gray')}</h3><p>${esc(s.path)}</p><p>${s.type} · ${s.count} 篇示例资料</p></div><div class="source-actions"><button class="btn small" data-source-edit="${s.id}">编辑</button><button class="btn small" data-source-index="${s.id}">模拟索引</button><button class="btn ghost small" data-source-archive="${s.id}">移除…</button></div></div>`).join('')||`<div class="empty">${icon('source')}<h3>还没有资料源</h3><p>登记一个示例路径，体验索引与管理流程。</p></div>`}<div class="hint">预览只登记文本路径并生成示例索引，不读取本机文件。${state.sources.some(s=>s.archived)?btn('查看已移除来源','source-trash','ghost small'):''}</div></div>`}
function sourceEditor(id){const s=state.sources.find(x=>x.id===id);modal(s?'编辑资料源':'添加资料源',`<div class="form-grid">${field('资料源名称','source-name',s?.name||'')}${field('资料路径（示例）','source-path',s?.path||'Documents / Samples / NewSource')}</div><p>该路径只用于预览。原文件不会被读取、修改或删除。</p>`,[{label:'取消',run:closeModal},{label:s?'保存修改':'添加资料源',style:'primary',run:()=>{const name=$('#source-name').value.trim(),path=$('#source-path').value.trim();if(!name||!path){dialogError('请填写名称和资料路径。');return}if(state.sources.some(x=>x.id!==id&&!x.archived&&x.path.toLowerCase()===path.toLowerCase())){dialogError('此路径已登记，请使用现有资料源。');return}if(s)Object.assign(s,{name,path,count:0,status:'待索引'});else state.sources.push({id:Date.now(),name,path,type:'本地文件夹',count:0,status:'待索引',archived:false});record('资料源已登记',name+' · 预览路径');closeModal();render();toast('资料源已保存，可模拟建立索引')}}])}
function settings(){const map={directory:['你的资料，有自己的位置。','推荐一个默认目录，也尊重你的工作习惯。'],appearance:['安静的界面，清楚的重点。','日常浅色。减少视觉负担，让操作更直接。'],startup:['每次启动，都按你的习惯。','启动动作有明确来源，也有对应的记录。'],credentials:['凭据，妥善放在这里。','低频管理独立收纳，避免日常操作时误触。'],preview:['关于这个工作空间。','Phayton R2 · 完整交互设计预览']};let body='';if(state.setting==='directory'){body=`<div class="panel"><div class="inline between"><h2>统一用户目录</h2>${badge('推荐默认')}</div><div class="path-row"><label>用户资料根目录<input id="user-root" value="${esc(state.prefs.root)}"></label>${btn('使用推荐路径','default-root')}</div><div class="folder-grid">${[['Projects','工程配置'],['Knowledge','笔记与资料'],['Apps','应用与绑定'],['UserPmlLib','自建 PML'],['Exports','导出结果']].map(([n,t])=>`<div class="folder">${icon('folder')}<div><b>${n}</b><small>${t}</small></div></div>`).join('')}</div><div class="panel-footer"><small>先预览，再确认；保留原有资料。</small>${btn('预览目录变更 →','directory-preview','primary')}</div></div><div class="panel"><div class="inline">${icon('shield')}<h2>升级时，保留你的数据。</h2></div><p class="subtitle">程序文件与用户资料分开。知识库、工程配置和自建工具都有独立的位置。</p><button class="btn ghost small" data-article="directory" style="margin-top:18px">了解升级与目录兼容 ↗</button></div>`}
 else if(state.setting==='appearance'){body=`<div class="panel"><h2>外观</h2><div class="choice-grid"><label class="choice"><input type="radio" name="appearance" checked>浅色工作空间<small>白色内容区、灰蓝导航、蓝色主要动作。</small></label><div class="choice"><b>Phayton / R2</b><small>工程、知识、设置与文档共享设计语言。</small></div></div><div class="setting-row"><div><h3>减少动态效果</h3><p>关闭页面过渡和控件动画。</p></div><input type="checkbox" class="switch" id="motion" aria-label="减少动态效果" ${state.prefs.motion?'checked':''}></div><div class="setting-row"><div><h3>紧凑内容间距</h3><p>列表和内容区使用更紧凑的间距。</p></div><input type="checkbox" class="switch" id="compact" aria-label="紧凑内容间距" ${state.prefs.compact?'checked':''}></div><p class="hint">选择立即应用于本预览；同时尊重系统“减少动画”的偏好。</p></div>`}
 else if(state.setting==='startup'){body=`<div class="panel"><h2>特殊启动动作</h2><p class="subtitle">在 PML 就绪后执行，并在启动记录中标明。</p><div class="choice-grid"><label class="choice"><input type="radio" name="startup" value="rehash-all" ${state.prefs.startup==='rehash-all'?'checked':''}>每次启动 REHASH ALL<small>切换 AM / E3D 后重新建立 PML 索引。</small></label><label class="choice"><input type="radio" name="startup" value="none" ${state.prefs.startup==='none'?'checked':''}>不执行额外命令<small>只使用产品原有的启动流程。</small></label></div><div class="setting-row"><div><h3>记录特殊启动行为</h3><p>保留所选策略与本次操作摘要。</p></div><input type="checkbox" class="switch" id="startup-log" aria-label="记录特殊启动行为" ${state.prefs.startupLog?'checked':''}></div><div class="panel-footer"><button class="btn ghost small" data-article="startup">查看 REHASH 说明 ↗</button>${btn('保存启动设置','save-startup','primary')}</div></div>`}
 else if(state.setting==='credentials'){body=`<div class="panel"><div class="inline between"><h2>本机账户</h2>${badge(state.passwordSaved?'已保存演示凭据':'未保存',state.passwordSaved?'green':'gray')}</div><div class="setting-row"><div><h3>${esc(state.project.name)} / ${esc(state.project.user)}</h3><p>当前工程的演示账户</p></div>${icon('shield')}</div><p class="hint">真实程序继续使用原有凭据机制。本预览不读取 Windows 凭据，只维护演示状态。</p><div class="secure-block"><h3>密码管理</h3><p>清除后，下次启动需要重新填写。操作前会再次确认。</p>${btn('清除保存的密码…','clear-password','danger',state.passwordSaved?'':'disabled')}</div></div>`}
 else body=`<div class="panel"><div class="inline"><span class="logo">P</span><h2>Phayton / R2</h2></div><p class="subtitle">完整宽屏交互预览 · 2026.10</p><div class="setting-row"><div><h3>本次预览</h3><p>工程启动、知识库、设置、DocFX、应用与运行记录。</p></div>${badge('预览模式')}</div><p class="hint">全部操作只影响本页面内存。刷新会恢复示例；不连接后端或 IPC，不读取真实业务文件；CSV 仅下载合成数据。正式桌面、DocFX 主题与现有运行标识保持兼容。</p><div class="panel-footer"><button class="btn" data-route="docs/updates">查看 R2 更新内容 ↗</button>${btn('重置本次预览…','reset-preview','ghost')}</div></div>`;
 const help=state.setting==='directory'?'<h3>属于你的工作空间</h3><p>推荐默认目录可修改。</p><p>复制前核对差异，完成后再切换。</p><hr><h3>当前预览路径</h3><p style="overflow-wrap:anywhere">'+esc(state.prefs.root)+'</p><p>这是界面演示，不会移动真实文件。</p>':state.setting==='credentials'?'<h3>先确认，再清除</h3><p>密码管理集中在设置中。取消确认时保留原状态。</p>':'<h3>保持简单，也留有余地</h3><p>日常设置直接可见，复杂参数渐进展开。</p><p>设置只在本次预览中生效。</p>';
 return heading('SETTINGS / YOUR PREFERENCES',map[state.setting][0],map[state.setting][1])+`<div class="settings-layout"><div>${body}</div><aside class="settings-help">${help}</aside></div>`}
function apps(){return heading('APPS / DATA READER','数据，有清楚的来处。','检查绑定与参数，再把结果放进可用的表格。',btn('按钮绑定','binding'))+`<div class="panel"><div class="inline between"><h2>ELDATA 读取</h2>${badge('合成数据演示','gray')}</div><div class="binding-summary"><div><small>读取目标</small><p>${esc(state.binding.target)} · ${esc(state.binding.attribute)}</p></div>${btn(state.running?'读取中…':'读取演示数据 →','read','primary',state.running?'disabled':'')}</div><div class="steps"><span class="${state.rows.length?'done':''}">01 VAR SPLIT 提取</span><span>→</span><span class="${state.rows.length?'done':''}">02 结果格式化</span><span>→</span><span class="${state.rows.length?'done':''}">03 下标遍历</span></div><div id="results">${table()}</div></div>`}
function table(){if(state.readError)return '<div class="error" role="alert">模拟 IPC 超时。结果尚未取得；未自动重试。请在按钮绑定中关闭失败模拟后重试。</div>';if(!state.rows.length)return `<div class="empty">${icon('apps')}<h3>${state.running?'正在组织演示结果':'结果将在这里呈现'}</h3><p>使用 32 条合成数据体验筛选、排序、分页与导出。</p></div>`;const rows=state.rows.filter(r=>`${r.index} ${r.value} REAL`.toLowerCase().includes(state.filter.toLowerCase())).sort((a,b)=>(a.index-b.index)*(state.ascending?1:-1));const pages=Math.max(1,Math.ceil(rows.length/7));state.tablePage=Math.min(state.tablePage,pages);return `<div class="table-tools"><h3>结果表格　<small>${rows.length} 条</small></h3><div class="inline"><input id="table-filter" aria-label="筛选结果" placeholder="筛选结果…" value="${esc(state.filter)}">${btn('导出 CSV','export','small')}</div></div><table><thead><tr><th><button data-action="sort">下标 ${state.ascending?'↑':'↓'}</button></th><th>值</th><th>类型</th></tr></thead><tbody>${rows.slice((state.tablePage-1)*7,state.tablePage*7).map(r=>`<tr><td>${String(r.index).padStart(2,'0')}</td><td>${r.value}</td><td>REAL</td></tr>`).join('')||'<tr><td colspan="3">没有匹配的结果</td></tr>'}</tbody></table><div class="pagination"><span>合成数据 · 每页 7 条</span><span><button data-action="prev" aria-label="上一页" ${state.tablePage===1?'disabled':''}>‹</button> ${state.tablePage} / ${pages} <button data-action="next" aria-label="下一页" ${state.tablePage===pages?'disabled':''}>›</button></span></div>`}
function records(){return heading('ACTIVITY / YOUR HISTORY','每一步，都有迹可循。','查看这次预览中的操作与结果。',btn('清空演示记录…','clear-records'))+`<div class="panel log-list">${state.records.length?state.records.map((r,i)=>`<div class="log-row"><span class="status">${r.status==='失败'?'!':'✓'}</span><div><h3>${esc(r.title)}</h3><p>${esc(r.detail)}</p></div><small>${r.time}</small><button class="btn ghost small" data-log="${i}">查看详情</button></div>`).join(''):`<div class="empty">${icon('clock')}<h3>还没有操作记录</h3><p>试着保存笔记、调整设置或读取演示数据。</p><button class="btn" data-route="knowledge">打开知识库 →</button></div>`}</div>`}

function docToc(){return `<aside class="doc-toc"><h3>${state.doc==='api'?'API 参考':'开发指南'}</h3><div class="context-label">从这里开始</div>${Object.entries(docTitles).map(([id,t])=>`<button data-article="${id}" class="${state.doc==='guide'&&state.article===id?'active':''}">${t}</button>`).join('')}<div class="context-label">相关参考</div><button data-route="docs/api" class="${state.doc==='api'?'active':''}">PhaytonObjectWalker</button><button data-route="docs/updates" class="${state.doc==='updates'?'active':''}">R2 更新记录</button><button data-action="bookmarks">我的文档书签 (${state.bookmarks.length})</button></aside>`}
function docContent(){let body,title,sub,kicker,sections=[];if(state.doc==='guide'){const a=guides[state.article];title=docTitles[state.article];sub=a.intro;kicker=a.eyebrow;sections=[a.one,a.two];body=`<div class="article-meta"><span>阅读约 3 分钟</span><span>设计预览内容</span><span>2026.10.23</span>${btn(state.bookmarks.includes(state.article)?'已收藏 ✓':'收藏文档','bookmark','ghost small')}</div><section class="doc-section" id="doc-one"><h2>01　${a.one}</h2><p>${a.body}</p><div class="code-top"><span>现有调用 / 说明示例</span>${btn('复制','copy-code','ghost small')}</div><pre><code id="article-code">${esc(a.code)}</code></pre></section><section class="doc-section" id="doc-two"><h2>02　${a.two}</h2><p>${a.last}</p></section><div class="callout">页面是可操作的界面预览。文档中的运行标识保持现有名称；本页不会执行代码。</div><div class="article-pager"><button class="btn ghost small" data-route="docs">← 文档首页</button><button class="btn" data-article="${a.next}">下一篇：${docTitles[a.next]} →</button></div>`}
 else if(state.doc==='api'){title='PhaytonObjectWalker';sub='对象取值、结果格式化与后续遍历。';kicker='API REFERENCE / PML OBJECT';sections=['方法与参数','来源与相关指南'];body=`<div class="article-meta"><span>PML Object</span><span>来自当前源码声明</span>${badge('签名保持不变','gray')}</div><div class="tabs">${[['overview','概览'],['parameters','参数'],['related','相关文档']].map(([id,t])=>`<button data-api-tab="${id}" class="${state.apiTab===id?'active':''}">${t}</button>`).join('')}</div><section class="doc-section" id="doc-one">${state.apiTab==='overview'?'<h2>MatchLargeArr</h2><p>沿用 VAR SPLIT 的大数组提取路径，供 Walker 的取值流程使用。以下签名从当前 PML 源码核对，不因 Phayton 展示名称而改写。</p><pre><code>define method .MatchLargeArr(!parentBox is array, !lastfixArr is string) is array</code></pre>':state.apiTab==='parameters'?'<h2>方法参数</h2><table><thead><tr><th>名称</th><th>类型</th></tr></thead><tbody><tr><td>parentBox</td><td>ARRAY</td></tr><tr><td>lastfixArr</td><td>STRING</td></tr><tr><td>返回值</td><td>ARRAY</td></tr></tbody></table><p>真实契约以源码 XML 注释和正式 DocFX 生成的完整参考为准。</p>':`<h2>相关指南</h2>${['data','pml','errors'].map(id=>`<div class="row-card"><div class="grow"><h3>${docTitles[id]}</h3></div><button class="btn small" data-article="${id}">阅读 →</button></div>`).join('')}`}</section><section class="doc-section" id="doc-two"><h2>来源与验证范围</h2><p>PMLLIB / Traversal / PhaytonObjectWalker.pmlobj</p><p>已有真实数组提取成功记录；最新大数组卡顿仍待复验。本轮仅评审文档布局与交互。</p></section>`}
 else{title='R2：把工作空间补齐。';sub='统一的导航、清楚的层级、可以操作的页面。';kicker='WHAT’S NEW / DESIGN PREVIEW';sections=['这一轮的变化','预览与正式界面'];body=`<div class="article-meta"><span>2026.10.23</span>${badge('设计评审')}</div><section class="doc-section" id="doc-one"><h2>这一轮的变化</h2>${[['工程','最近工程、模块选择与登录字段'],['知识库','笔记编辑、修订、归档与资料源'],['设置','目录变更、外观、启动与凭据'],['DocFX','首页、指南、API、搜索和收藏']].map(([t,p])=>`<div class="row-card"><div class="grow"><h3>${t}</h3><p>${p}</p></div>${icon('check')}</div>`).join('')}</section><section class="doc-section" id="doc-two"><h2>预览与正式界面</h2><p>统一使用 Phayton 展示名。正式桌面、正式文档主题和现有调用保持原状。所有交互数据只保留在本次页面内存。</p></section>`}
 return `<div class="doc-layout page">${docToc()}<article id="main" tabindex="-1" class="doc-article"><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${sub}</p>${body}</article><aside class="doc-aside"><b>本页内容</b><a href="#doc-one" data-anchor="doc-one">${sections[0]}</a><a href="#doc-two" data-anchor="doc-two">${sections[1]}</a><hr><b>接着探索</b><button data-route="knowledge">记录到知识空间 ↗</button><button data-route="apps">打开数据演示 ↗</button></aside></div>`}

function updateSearch(q){const entries=[['工程工作空间','launch','页面 · 启动与模块'],['知识库','knowledge','页面 · 个人笔记与资料'],['设置 · 用户目录','settings/directory','设置 · 数据位置'],['设置 · 账户与凭据','settings/credentials','设置 · 密码管理'],...Object.entries(docTitles).map(([id,t])=>[t,'docs/guide/'+id,'文档 · '+guides[id].intro]),['PhaytonObjectWalker · API','docs/api','API · 对象、方法与参数']];const found=entries.filter(a=>a.join(' ').toLowerCase().includes(q.toLowerCase()));$('#global-results').innerHTML=found.map(([title,route,meta])=>`<button class="search-result" data-search-route="${route}"><b>${title}</b><small>${esc(meta)}</small></button>`).join('')||'<div class="empty"><h3>没有匹配结果</h3><p>试试“目录”“PML”或“启动”。</p></div>'}
async function runRead(){if(state.running)return;state.running=true;state.rows=[];state.readError=false;render();await new Promise(resolve=>setTimeout(resolve,850));state.running=false;if(state.simulateError){state.readError=true;record('演示读取失败','模拟 IPC 超时；没有自动重试。','失败');toast('模拟超时已记录')}else{state.rows=Array.from({length:32},(_,i)=>({index:i+1,value:(i<7?[0,1240,360,0,880.5,42,1][i]:Math.round(Math.sin(i)*100000)/100).toFixed(3)}));state.tablePage=1;record('演示读取完成','32 项提取 → 32 项格式化 → 下标 1…32');toast('32 条合成记录已就绪')}if(state.page==='apps')render()}
function noteSave(){const n=selectedNote();const title=$('#note-title').value.trim(),tags=$('#note-tags').value.trim(),body=$('#note-body').value.trim();if(!title||!body){$('#note-error').hidden=false;$('#note-error').textContent='请填写标题和正文。';return}if(!n.isNew)n.history.unshift({title:n.title,tags:n.tags,body:n.body,rev:n.rev,time:n.time});Object.assign(n,{title,tags,body,rev:n.isNew?1:n.rev+1,time:'刚刚',isNew:false});state.editing=false;state.editDirty=false;record('笔记已保存',title+' · 修订 '+n.rev);render();toast('笔记已保存，可查看修订记录')}
function editNote(){const n=selectedNote();if(!n||n.archived)return;state.editing=true;render();$('#note-title').focus()}
function cancelEdit(){const n=selectedNote();const cancel=()=>{if(n?.isNew){state.notes=state.notes.filter(x=>x.id!==n.id);state.noteId=state.notes.find(x=>!x.archived)?.id}state.editing=false;state.editDirty=false;render()};if(state.editDirty)confirm('放弃本次编辑？','<p>已保存的正文与修订记录会保留。</p>',cancel,'放弃改动');else cancel()}

 product(){captureProject();modal('选择产品',`<label>产品<select id="product-select">${['E3D 2.1','AM 12.1','PDMS'].map(p=>`<option ${state.project.product===p?'selected':''}>${p}</option>`).join('')}</select></label><p>此处只切换演示配置，不检测或启动本机安装。</p>`,[{label:'取消',run:closeModal},{label:'选择产品',style:'primary',run:()=>{state.project.product=$('#product-select').value;closeModal();render()}}])},
 modules(){captureProject();modal('选择工作模块',`<label>模块<select id="module-select">${['DESIGN','PARAGON','DRAW','ISODRAFT','ADMIN','MONITOR'].map(m=>`<option ${state.project.module===m?'selected':''}>${m}</option>`).join('')}</select></label>${field('自定义模块（可选）','custom-module','')}`, [{label:'取消',run:closeModal},{label:'选择模块',style:'primary',run:()=>{const m=$('#custom-module').value.trim()||$('#module-select').value;if(!/^[A-Za-z][A-Za-z0-9_]*$/.test(m)){dialogError('模块名仅使用字母、数字和下划线。');return}state.project.module=m.toUpperCase();closeModal();render()}}])},
 advanced(){captureProject();modal('高级启动选项','<p>程序路径、特殊启动策略和日志集中管理。日常启动表单只保留必要信息。</p><p>当前预览可在设置中选择 REHASH 行为。</p>',[{label:'返回',run:closeModal},{label:'打开启动设置',style:'primary',run:()=>{closeModal();go('settings/startup')}}])},
 launch(){captureProject();if(!state.project.name||!state.project.user||!state.project.mdb){toast('请填写项目名称、用户名和 MDB');return}confirm('启动工程预览',`<p>${esc(state.project.product)} · ${esc(state.project.name)} / ${state.project.module}</p><p>MDB：${esc(state.project.mdb)}</p><p>此操作演示确认与记录流程，不启动真实 AVEVA。</p>`,()=>{const p=state.projects.find(p=>p.name===state.project.name);if(p)Object.assign(p,state.project,{time:'刚刚'});else state.projects.unshift({...state.project,time:'刚刚'});record('工程启动预览',state.project.name+' / '+state.project.module+' · '+state.prefs.startup);render();toast('演示启动已记录，真实客户端未启动')},'模拟启动')},
 'new-note'(){guardNavigation(()=>{state.library='notes';state.noteSearch='';const n={id:Date.now(),title:'',tags:'PML',body:'',rev:1,time:'刚刚',archived:false,history:[],isNew:true};state.notes.unshift(n);state.noteId=n.id;state.editing=true;state.editDirty=false;render();$('#note-title').focus()})},
 'edit-note':editNote,'cancel-edit':cancelEdit,'save-note':noteSave,
 'clear-note-search'(){state.noteSearch='';render()},
 'archive-note'(){const n=selectedNote();if(!n)return;confirm('归档这篇笔记？',`<p>${esc(n.title)}</p><p>正文和修订记录都会保留，可以从“归档”恢复。</p>`,()=>{n.archived=true;record('笔记已归档',n.title);render();toast('已归档，可以恢复')},'归档笔记')},
 'restore-note'(){const n=selectedNote();if(!n)return;n.archived=false;state.library='notes';state.noteSearch='';state.noteId=n.id;record('笔记已恢复',n.title);render();toast('已恢复到个人笔记')},
 history(){const n=selectedNote();if(!n)return;modal('修订记录 · '+n.title,`<p>当前修订 ${n.rev}。恢复旧版本会新增一个修订，保留完整历史。</p>${n.history.length?n.history.map((h,i)=>`<div class="history-item"><div class="inline between"><b>修订 ${h.rev} · ${esc(h.title)}</b><button class="btn small" data-history="${i}">恢复此修订</button></div><p>${esc(h.body.slice(0,140))}${h.body.length>140?'…':''}</p></div>`).join(''):'<p>还没有历史修订。编辑并保存一次后会在这里出现。</p>'}`,[{label:'关闭',run:closeModal}])},
 'new-source'(){sourceEditor()},
 'source-trash'(){modal('已移除的资料源',state.sources.filter(s=>s.archived).map(s=>`<div class="row-card"><div class="grow"><h3>${esc(s.name)}</h3><p>${esc(s.path)}</p></div><button class="btn small" data-source-restore="${s.id}">恢复</button></div>`).join(''),[{label:'关闭',run:closeModal}])},
 'default-root'(){$('#user-root').value='Documents / PhaytonWorkspace';toast('已填入推荐路径，尚未应用')},
 'directory-preview'(){const target=$('#user-root').value.trim();if(!target){toast('请填写用户资料目录');return}if(target===state.prefs.root){toast('目录没有变化');return}if(/[\x00-\x1f<>|?*]/.test(target)){toast('目录包含不支持的字符');return}confirm('预览目录变更',`<p>当前：${esc(state.prefs.root)}</p><p>目标：${esc(target)}</p><div class="ok">示例清单：5 个资料目录 · 0 个演示冲突</div><p>确认后只改变预览路径，不移动真实文件；原有数据保留。</p>`,()=>{const old=state.prefs.root;state.prefs.root=target;record('用户目录预览已更新',old+' → '+target);render();toast('演示路径已更新')},'确认使用此目录')},
 'save-startup'(){state.prefs.startup=$('input[name=startup]:checked').value;state.prefs.startupLog=$('#startup-log').checked;record('启动设置已保存',state.prefs.startup+' · '+(state.prefs.startupLog?'记录日志':'不记录日志'));render();toast('设置已应用到本次预览')},
 'clear-password'(){confirm('清除这份配置的密码？',`<p>${esc(state.project.name)} / ${esc(state.project.user)}</p><p>只清除本次预览的演示状态，真实 Windows 凭据不受影响。</p>`,()=>{state.passwordSaved=false;record('演示密码已清除',state.project.name);render();toast('演示凭据已清除')},'确认清除演示密码',true)},
 'reset-preview'(){confirm('重置本次预览？','<p>页面中的演示笔记、资料源和设置将恢复初始示例。正式用户数据不受影响。</p>',()=>location.reload(),'重置预览')},
 'clear-records'(){confirm('清空演示记录？','<p>只影响本次预览中的记录。</p>',()=>{state.records=[];render()},'清空')},
 binding(){modal('按钮绑定与参数',`<label>目标方法<select id="binding-method"><option>PhaytonObjectWalker.MatchLargeArr</option></select></label>${field('读取目标','binding-target',state.binding.target)}${field('属性名称','binding-attribute',state.binding.attribute)}<label class="check"><input type="checkbox" id="simulate-error" ${state.simulateError?'checked':''}>模拟 IPC 超时</label><p>运行标识保持原有契约。此处只演示绑定配置，不调用实际方法。</p>`,[{label:'取消',run:closeModal},{label:'保存绑定',style:'primary',run:()=>{const target=$('#binding-target').value.trim(),attribute=$('#binding-attribute').value.trim();if(!target||!attribute){dialogError('请填写目标和属性名称。');return}state.binding={method:$('#binding-method').value,target,attribute};state.simulateError=$('#simulate-error').checked;closeModal();record('演示绑定已保存',attribute);render();toast('绑定与参数已更新')}}])},
 read:runRead,sort(){state.ascending=!state.ascending;$('#results').innerHTML=table()},prev(){state.tablePage=Math.max(1,state.tablePage-1);$('#results').innerHTML=table()},next(){state.tablePage++;$('#results').innerHTML=table()},
 export(){const rows=state.rows.filter(r=>`${r.index} ${r.value} REAL`.toLowerCase().includes(state.filter.toLowerCase())).sort((a,b)=>(a.index-b.index)*(state.ascending?1:-1));const csv='\uFEFFIndex,Value,Type\r\n'+rows.map(r=>`${r.index},${r.value},REAL`).join('\r\n');const a=document.createElement('a'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.href=url;a.download='Phayton-ELDATA-demo.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);record('合成表格已导出',rows.length+' 行 CSV');toast('已导出当前筛选结果')},
 bookmark(){const id=state.article;state.bookmarks=state.bookmarks.includes(id)?state.bookmarks.filter(x=>x!==id):[...state.bookmarks,id];render();toast(state.bookmarks.includes(id)?'已加入文档书签':'已取消收藏')},
 bookmarks(){modal('我的文档书签',state.bookmarks.length?state.bookmarks.map(id=>`<button class="search-result" data-search-route="docs/guide/${id}"><b>${docTitles[id]}</b><small>开发指南</small></button>`).join(''):'<p>还没有收藏的文档。在指南页点击“收藏文档”即可加入。</p>',[{label:'关闭',run:closeModal}])},
 async 'copy-code'(){const text=$('#article-code')?.textContent||'';try{await navigator.clipboard.writeText(text);toast('示例已复制')}catch{modal('复制示例',`<textarea rows="5" readonly aria-label="待复制示例">${esc(text)}</textarea><p>此浏览器没有开放剪贴板写入，可选中以上内容复制。</p>`,[{label:'关闭',run:closeModal}])}}
};

document.addEventListener('click',e=>{const anchor=e.target.closest('[data-anchor]');if(anchor){e.preventDefault();document.getElementById(anchor.dataset.anchor)?.scrollIntoView({behavior:state.prefs.motion?'instant':'smooth',block:'start'});return}const b=e.target.closest('button');if(!b||b.disabled||b.dataset.modal!==undefined)return;const d=b.dataset;if(d.route){go(d.route);return}if(d.searchRoute){closeModal();go(d.searchRoute);return}if(d.article){openArticle(d.article);return}if(d.setting){go('settings/'+d.setting);return}if(d.library){guardNavigation(()=>{state.library=d.library;state.noteSearch='';render()});return}if(d.tag){guardNavigation(()=>{state.library='notes';state.noteSearch=d.tag;render()});return}if(d.note){guardNavigation(()=>{state.noteId=+d.note;render()});return}if(d.project!==undefined){captureProject();state.project={...state.projects[+d.project]};render();return}if(d.module){captureProject();state.project.module=d.module;render();return}if(d.apiTab){state.apiTab=d.apiTab;render();return}if(d.sourceEdit){sourceEditor(+d.sourceEdit);return}if(d.sourceIndex){const s=state.sources.find(x=>x.id===+d.sourceIndex);s.count=3;s.status='演示索引';record('资料源模拟索引完成',s.name+' · 3 篇合成资料');render();toast('示例索引已生成，未读取真实文件');return}if(d.sourceArchive){const s=state.sources.find(x=>x.id===+d.sourceArchive);confirm('移除资料源登记？',`<p>${esc(s.name)}</p><p>原文件不会删除。可在已移除来源中恢复登记。</p>`,()=>{s.archived=true;record('资料源登记已移除',s.name);render()},'移除登记');return}if(d.sourceRestore){const s=state.sources.find(x=>x.id===+d.sourceRestore);if(state.sources.some(x=>x.id!==s.id&&!x.archived&&x.path.toLowerCase()===s.path.toLowerCase())){dialogError('相同路径已有登记，请先处理重复来源。');return}s.archived=false;closeModal();render();toast('资料源登记已恢复');return}if(d.history!==undefined){const n=selectedNote(),h={...n.history[+d.history]};confirm('恢复到修订 '+h.rev+'？','<p>将创建一个新的修订，现有内容也会保留在历史中。</p>',()=>{n.history.unshift({title:n.title,tags:n.tags,body:n.body,rev:n.rev,time:n.time});Object.assign(n,{title:h.title,tags:h.tags,body:h.body,rev:n.rev+1,time:'刚刚'});record('已恢复历史修订',n.title+' · 新修订 '+n.rev);render();toast('历史内容已恢复为新修订')},'恢复为新修订');return}if(d.log!==undefined){const r=state.records[+d.log];modal(r.title,`<p>${esc(r.detail)}</p><p>${r.time} · ${r.status} · 本次预览</p>`,[{label:'关闭',run:closeModal}]);return}if(d.action)actions[d.action]?.()});
document.addEventListener('input',e=>{const id=e.target.id;if(id==='project-search'){state.projectSearch=e.target.value;$$('.recent').forEach(b=>b.hidden=!b.dataset.match.includes(state.projectSearch.toLowerCase()))}if(id==='note-search'){if(state.editing){toast('请先保存或取消编辑，再筛选笔记');e.target.value=state.noteSearch;return}const pos=e.target.selectionStart;state.noteSearch=e.target.value;render();$('#note-search').focus();$('#note-search').setSelectionRange(pos,pos)}if(['note-title','note-tags','note-body'].includes(id))state.editDirty=true;if(id==='global-query')updateSearch(e.target.value);if(id==='table-filter'){const pos=e.target.selectionStart;state.filter=e.target.value;state.tablePage=1;$('#results').innerHTML=table();$('#table-filter').focus();$('#table-filter').setSelectionRange(pos,pos)}});
document.addEventListener('change',e=>{const id=e.target.id;if(id==='remember')state.remember=e.target.checked;if(id==='motion'){state.prefs.motion=e.target.checked;document.body.classList.toggle('no-motion',state.prefs.motion);toast('动态效果偏好已更新')}if(id==='compact'){state.prefs.compact=e.target.checked;document.body.classList.toggle('compact',state.prefs.compact);toast('内容间距已更新')}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();search()}});
let renderedHash=location.hash;
window.addEventListener('popstate',()=>{const destination=location.hash;if(state.editing&&state.editDirty){history.replaceState(null,'',renderedHash||'#launch');guardNavigation(()=>{history.pushState(null,'',destination||'#launch');routeFromHash();render();renderedHash=location.hash})}else{discardDraft();routeFromHash();render();renderedHash=location.hash}});
routeFromHash();render();
</script></body></html>
