name: Package standalone PmlTwin 0.3.5.6

on:
  push:
    branches:
      - codex/pmltwin-release-build-0.3.5.6

jobs:
  package:
    if: github.repository == 'SoloLevelingAI/PmlTrigger.Yuzuha'
    runs-on: windows-2025
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: dispatch
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/v0.3.5.6
          path: release-source
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Obtain the verified Inno Setup compiler
        id: inno
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          $folder = Join-Path $env:RUNNER_TEMP 'Inno-6.7.3'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $installer
          $hash = (Get-FileHash -LiteralPath $installer).Hash
          if ($hash -ine '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732') { throw 'Inno Setup hash mismatch.' }
          $process = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',('/DIR="'+$folder+'"')) -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Compiler setup exited $($process.ExitCode)" }
          $compiler = (Resolve-Path -LiteralPath (Join-Path $folder 'ISCC.exe')).Path
          "path=$compiler" >> $env:GITHUB_OUTPUT
      - name: Build and verify the standalone release payload
        id: build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NuGetAudit: 'false'
          PYTHONDONTWRITEBYTECODE: '1'
          INNO_COMPILER: ${{ steps.inno.outputs.path }}
        run: |
          & ./dispatch/.github/release-build/pmltwin-package.ps1 -Checkout ./release-source -Compiler $env:INNO_COMPILER
      - name: Attach verified assets to the existing draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_DIRECTORY: ${{ steps.build.outputs.release_directory }}
        run: |
          & ./dispatch/.github/release-build/pmltwin-assets.ps1 -PackageDirectory $env:PACKAGE_DIRECTORY
